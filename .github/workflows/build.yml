name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dll:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scarica SDK WebView2
        shell: pwsh
        run: .\build\get-sdk.ps1

      - name: Compila OutlookAdFix.dll
        shell: cmd
        run: build\build.cmd

      - name: Carica l'artefatto
        uses: actions/upload-artifact@v4
        with:
          name: OutlookAdFix
          path: OutlookAdFix.dll

      - name: Allega alla release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OutlookAdFix.dll
